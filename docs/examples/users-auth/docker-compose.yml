# Postgres 16 on host port 54330. Data lives on tmpfs, so every start is empty.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feathers_example
    ports:
      - '127.0.0.1:54330:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d feathers_example']
      interval: 1s
      timeout: 3s
      retries: 30
