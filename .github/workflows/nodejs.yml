name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feathers_kysely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feathers_kysely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
        env:
          CI: true
      - run: npm test -w packages/kysely
        env:
          CI: true
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/feathers_kysely_test
